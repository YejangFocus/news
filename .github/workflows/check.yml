name: Check site

# PR 과 main 푸시 때 링크·이미지·JSON·접근성(alt, 중복 id, main 랜드마크 개수)을 점검한다.
# 기사 동기화 봇 커밋([skip ci])은 건너뛴다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 사이트 점검 (깨진 링크·이미지·JSON·alt·중복 id)
        run: python3 scripts/check_site.py
      - name: 파이썬 스크립트 문법 검사
        run: python3 -m py_compile scripts/*.py
      - name: 자바스크립트 문법 검사
        run: |
          for f in assets/js/*.js sw.js; do node --check "$f"; done
