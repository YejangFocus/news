name: Add event from issue

# '행사·일정 등록' 이슈 양식을 제출하면 data/events.json 에 일정을 추가하고 홈을 다시 그린다.
# 저장소 소유자·구성원·협력자가 올린 이슈만 처리한다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-event
  cancel-in-progress: false

jobs:
  add:
    if: >-
      contains(github.event.issue.labels.*.name, '일정') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 일정 추가
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python3 scripts/add_event.py > result.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 커밋 & 푸시
        if: steps.add.outputs.code == '0'
        run: |
          git config user.name "yejangfocus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json index.html
          git commit -m "chore: 행사·일정 추가 (이슈 #${{ github.event.issue.number }}) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1

      - name: 결과 댓글 & 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CODE: ${{ steps.add.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then
            { echo "일정을 등록했습니다. 잠시 뒤 홈 화면에 반영됩니다."; echo; echo '```'; cat result.txt; echo '```'; } > comment.md
            gh issue comment "$ISSUE" --body-file comment.md
            gh issue close "$ISSUE" --reason completed
          else
            { echo "일정을 등록하지 못했습니다. 아래를 고쳐 새 이슈로 다시 올려 주세요."; echo; cat result.txt; } > comment.md
            gh issue comment "$ISSUE" --body-file comment.md
            gh issue close "$ISSUE" --reason "not planned"
          fi
