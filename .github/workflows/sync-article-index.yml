name: Sync ARTICLE_INDEX

# 신학/예지예정.html 처럼 기사 HTML을 새로 올리고(push) 하면
# 자동으로 data/articles.json(ARTICLE_INDEX)을 갱신해서 다시 커밋합니다.
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '!index.html'
      - '!404.html'
      - '!공지.html'
      - '!이슈.html'
      - '!주간브리핑.html'
      - '!메인화면/**'
      - '!ETC/**'
      - '!검색.html'
      - '!전체/**'
      - '!**/index.html'
  # 구글 뉴스 sitemap 은 최근 2일 기사만 담아야 하므로, 새 글이 없어도 매일 한 번 다시 만든다.
  schedule:
    - cron: '17 15 * * *'   # 매일 00:17 KST
  workflow_dispatch: {}   # 필요하면 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: sync-article-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 파일별 마지막 커밋 시각을 읽기 위해 전체 히스토리 필요

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 글꼴 설치 (사진 없는 기사의 미리보기 카드용)
        run: sudo apt-get install -y -qq fonts-nanum

      - name: 이미지 처리 라이브러리(Pillow) 설치
        run: pip install pillow

      - name: 이미지 최적화 (WebP 변환 + srcset·지연 로딩 반영)
        run: python3 scripts/optimize_images.py --rewrite

      - name: ARTICLE_INDEX 동기화 + 링크 미리보기(og:image) 정리 스크립트 실행
        run: python3 scripts/sync_article_index.py

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name "yejangfocus-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/articles.json 외에, 스크립트가 고친 기사 HTML(og:image 등 링크
          # 미리보기 태그)과 새로 뽑아낸 이미지(assets/images, assets/og)도 함께 커밋한다.
          git add -A -- index.html 검색.html data/articles.json data/search-index.json sitemap.xml news-sitemap.xml feed.xml assets/images assets/og '*.html'
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: ARTICLE_INDEX 자동 동기화 [skip ci]"
            # GitHub 서버 일시 오류(Internal Server Error)나 동시 push로 실패해도
            # 최대 5번까지 최신 main 위로 다시 얹어 재시도한다.
            for i in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "push 실패 ($i/5) — ${i}0초 후 재시도"
              sleep $((i * 10))
              git pull --rebase -X theirs origin main || git rebase --abort
            done
            echo "push 5회 실패"; exit 1
          fi
