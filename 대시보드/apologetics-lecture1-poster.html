<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기독교 변증학 제1강 · 알리스터 맥그래스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --paper:#ffffff; --ink:#3d3226; --ink-soft:#6b5a48;
  --line:#5b4636; --gold:#f6c453; --coral:#f08a5d; --sky:#8fc7e8;
  --leaf:#8cc084; --plum:#b49fdc; --rose:#f2a7b5; --teal:#6cc1b5;
  --shadow:0 10px 28px rgba(91,70,54,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{
  font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:21px;line-height:1.75;
  color:var(--ink);background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 18%,rgba(246,196,83,.22) 0 120px,transparent 121px),
    radial-gradient(circle at 88% 12%,rgba(143,199,232,.25) 0 150px,transparent 151px),
    radial-gradient(circle at 85% 88%,rgba(242,167,181,.2) 0 140px,transparent 141px),
    radial-gradient(circle at 8% 90%,rgba(140,192,132,.2) 0 130px,transparent 131px);
  background-attachment:fixed;min-height:100vh;
}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px 40px}

/* ---------- 타이틀 ---------- */
.hero{width:100%;max-width:1100px;text-align:center;margin-bottom:26px}
.hero-art{width:100%;max-width:760px;margin:0 auto 10px;display:block;filter:drop-shadow(0 8px 18px rgba(91,70,54,.12))}
.badge{display:inline-block;background:var(--coral);color:#fff;font-family:'Noto Sans KR';font-weight:700;
  font-size:20px;padding:6px 22px;border-radius:999px;border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);margin-bottom:14px}
.hero h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(40px,7vw,72px);line-height:1.2;letter-spacing:-1px}
.hero h1 .hl{background:linear-gradient(transparent 58%,var(--gold) 58% 92%,transparent 92%);padding:0 6px}
.hero .who{font-family:'Noto Sans KR';font-weight:900;font-size:clamp(28px,4.4vw,42px);color:var(--coral);margin-top:6px}
.hero .who span{color:var(--ink-soft);font-weight:500;font-size:clamp(20px,2.6vw,26px);display:block}
.motto{display:inline-block;margin-top:18px;background:var(--paper);border:3px dashed var(--line);border-radius:22px;
  padding:12px 26px;font-family:'Gowun Batang',serif;font-size:clamp(21px,2.6vw,26px);font-weight:700}

/* ---------- 메뉴 ---------- */
.menu-title{font-family:'Noto Sans KR';font-weight:700;font-size:22px;color:var(--ink-soft);text-align:center;margin:26px 0 16px}
.menu{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:0 auto}
.menu button{
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:center;
  background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:20px 12px 18px;
  box-shadow:5px 5px 0 var(--line);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;color:var(--ink)
}
.menu button::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:var(--c)}
.menu button:hover,.menu button:focus-visible{transform:translate(-2px,-4px) rotate(-.6deg);box-shadow:8px 9px 0 var(--line);outline:none}
.menu button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.menu .ico{display:block;font-size:46px;line-height:1.1;margin:6px 0 4px}
.menu .num{display:inline-block;background:var(--c);color:var(--ink);font-weight:900;font-size:20px;border:2px solid var(--line);
  border-radius:999px;padding:0 12px;margin-bottom:6px}
.menu .t{display:block;font-weight:900;font-size:23px;line-height:1.35;word-break:keep-all}
.menu .s{display:block;font-size:20px;color:var(--ink-soft);line-height:1.4;margin-top:4px;word-break:keep-all}
.menu button.wide{grid-column:span 2}
.foot{margin-top:30px;text-align:center;font-size:20px;color:var(--ink-soft)}

/* ---------- 상세 패널 ---------- */
.overlay{position:fixed;inset:0;background:rgba(61,50,38,.55);backdrop-filter:blur(3px);display:none;
  align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:24px 16px}
.overlay.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-width:920px;background:var(--bg);border:4px solid var(--line);border-radius:30px;box-shadow:var(--shadow);
  overflow:hidden;animation:pop .3s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:translateY(30px) scale(.97)}to{transform:none}}
.p-head{background:var(--c);border-bottom:4px solid var(--line);padding:20px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:2}
.p-head .pi{font-size:44px;line-height:1}
.p-head h2{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.3;flex:1;word-break:keep-all}
.p-head h2 small{display:block;font-family:'Noto Sans KR';font-weight:500;font-size:20px;color:var(--ink)}
.close{flex:none;width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:30px;font-weight:900;cursor:pointer;
  box-shadow:3px 3px 0 var(--line);color:var(--ink);line-height:1}
.p-body{padding:26px 24px 30px}
.art{background:#fff;border:3px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:20px}
.art svg{display:block;width:100%;height:auto}
.verse{background:#fffdf6;border:3px solid var(--line);border-left:14px solid var(--c);border-radius:20px;padding:18px 22px;margin-bottom:26px;
  font-family:'Gowun Batang',serif;font-size:23px;line-height:1.7;position:relative}
.verse b{display:block;font-family:'Noto Sans KR';font-size:20px;color:var(--coral);margin-top:6px;text-align:right}
.p-body h3{font-family:'Noto Sans KR';font-weight:900;font-size:25px;margin:28px 0 12px;display:flex;align-items:center;gap:10px;word-break:keep-all}
.p-body h3::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--line)}
.p-body p{margin:0 0 14px;word-break:keep-all}
.p-body ul,.p-body ol{margin:0 0 16px 4px;padding-left:26px}
.p-body li{margin-bottom:8px;word-break:keep-all}
.p-body strong{background:linear-gradient(transparent 60%,rgba(246,196,83,.6) 60%)}
.quote{background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 22px 16px 58px;margin:16px 0 20px;position:relative;
  font-family:'Gowun Batang',serif;font-size:22px;line-height:1.75}
.quote::before{content:"“";position:absolute;left:14px;top:-6px;font-size:76px;color:var(--c);font-family:Georgia,serif;-webkit-text-stroke:2px var(--line)}
.quote cite{display:block;font-style:normal;font-family:'Noto Sans KR';font-size:20px;color:var(--ink-soft);margin-top:8px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:12px 0 18px}
.card{background:#fff;border:3px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:4px 4px 0 var(--line)}
.card .k{display:inline-block;font-family:'Noto Sans KR';font-weight:900;font-size:21px;background:var(--c);border:2px solid var(--line);border-radius:12px;padding:2px 12px;margin-bottom:8px}
.card p{margin:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 18px}
.vs .card:first-child{background:#eef7fd}.vs .card:last-child{background:#fff1ea}
.key{background:var(--gold);border:3px solid var(--line);border-radius:22px;padding:16px 20px;font-family:'Gowun Batang',serif;font-weight:700;
  font-size:23px;text-align:center;margin:18px 0;box-shadow:4px 4px 0 var(--line);word-break:keep-all}
.p-nav{display:flex;justify-content:space-between;gap:12px;padding:0 24px 26px}
.p-nav button{flex:1;font-family:'Noto Sans KR';font-weight:700;font-size:21px;padding:14px 10px;border-radius:18px;border:3px solid var(--line);
  background:#fff;box-shadow:3px 3px 0 var(--line);cursor:pointer;color:var(--ink)}
.p-nav button:disabled{opacity:.35;cursor:default}
.p-nav .home{background:var(--gold)}

@media (max-width:900px){.menu{grid-template-columns:repeat(3,1fr)} .menu button.wide{grid-column:span 3}}
@media (max-width:640px){
  .wrap{padding:22px 16px 30px}
  .menu{grid-template-columns:repeat(2,1fr);gap:14px}
  .menu button.wide{grid-column:span 2}
  .menu button{padding:16px 8px 14px;border-radius:22px;box-shadow:4px 4px 0 var(--line)}
  .menu .ico{font-size:38px}
  .menu .t{font-size:21px}
  .overlay{padding:10px 8px}
  .p-head{padding:14px 14px}
  .p-head .pi{font-size:34px}
  .close{width:50px;height:50px;font-size:26px}
  .p-body{padding:20px 16px 24px}
  .quote{padding:16px 16px 14px 46px}
  .quote::before{font-size:60px;left:8px}
  .verse{font-size:21px;padding:14px 16px}
  .vs{grid-template-columns:1fr}
  .p-nav{padding:0 16px 20px}
  .p-nav button{font-size:20px;padding:12px 6px}
}
</style>

{ c:'#f2a7b5', ico:'💗', t:'설명이 곧 변증이다', s:'치유와 회복의 복음 · 청중 이해', art:'heart',
  verse:'건강한 자에게는 의사가 쓸 데 없고 병든 자에게라야 쓸 데 있느니라', ref:'마가복음 2:17',
  body:`
  <h3>회심이 일깨운 두 가지 변증 주제</h3>
  <div class="cards">
    <div class="card"><span class="k">① 취약성 성찰</span><p>대안적 신앙 체계의 취약성에 대해 성찰하도록 사람들을 초대하기. 무신론이 지적으로 물샐 틈 없다고 생각했지만 그렇지 않았습니다.</p></div>
    <div class="card"><span class="k">② 기독교 설명</span><p>기독교가 무엇에 관한 것인지 설명하기. 옥스퍼드의 친구들이 설명해 줄 때까지 그 깊이와 풍요로움을 발견할 수 없었습니다.</p></div>
  </div>
  <p>기독교 신앙에 대한 세심한 설명은 변증학적으로 매우 효과적일 수 있습니다. 그처럼 처음에 제대로 이해하지 못한 채 기독교를 거부한 사람이 많을 것입니다.</p>
  <div class="key">“우리 신앙에 대한 효과적인 설명은 훌륭한 변증입니다.”<br>— 이 강좌 내내 반복될 주제</div>
  <h3>신앙의 깊이로 들어가는 초대</h3>
  <p>변증학은 우리 자신의 신앙을 더 깊이 파고들도록 하는 초대이기도 합니다. 신앙의 <strong>개별 요소들</strong>(각각 변증학적 잠재력이 풍부함)과 그것들이 속한 <strong>더 큰 그림</strong>을 함께 전하는 것입니다. 기독교의 큰 그림은 정말 흥미로우며, 맥그래스를 신앙으로 이끈 것도 바로 그것이었습니다(다음 강연에서 더 다룸). 신앙의 각 측면이 지닌 변증학적 잠재력을 식별하고 음미하는 것은 우리 신앙을 더욱 감사하게 여기도록 돕습니다.</p>
  <h3>예시: 그리스도는 치유와 회복을 가져오신다</h3>
  <ul>
    <li>그리스도의 사역에서, 그리고 신약성경이 그분의 의미를 풀어내는 풍부한 <strong>시각적 이미지</strong>들 속에서 이를 봅니다.</li>
    <li><strong>아우구스티누스</strong>는 그리스도를 인간 본성에 치유를 가져다주는 <strong>의사(Medicus)</strong>로 보았습니다.</li>
    <li>이 구원 이해는 상처 입고 손상된 깨진 세상에서 수용과 치유, 회복을 어디서 찾을지 궁금해하는 사람들에게 정말 강력하게 말을 건넵니다.</li>

  <p>기독교는 세상과 우리 자신을 이해하게 하는 <strong>큰 그림</strong>을 제공합니다. 그러므로 변증학은 <strong>경험</strong>과, 톨킨이 특별히 지적하듯 <strong>상상의 세계</strong>와, 그리고 나중 강연에서 다룰 <strong>아름다움</strong>과도 연결될 수 있습니다.</p>`},

  body:`

  <div class="quote">우리는 우리 청중의 언어를 배워야 합니다. 평범한 사람이 무엇을 이해하고 무엇을 이해하지 못하는지 사전에(a priori) 단정 짓는 것은 전혀 쓸모가 없습니다. 여러분은 경험을 통해 알아내야 합니다.<cite>— C.S. 루이스</cite></div>

    <div class="card"><span class="k">오해 ②</span><p>워드 프로세서에서 텍스트를 <strong>오른쪽 여백에 정렬</strong>하는 것 — 울퉁불퉁한 텍스트를 곧게 펴는 것.</p></div>
  </div>

{ c:'#f2a7b5', ico:'🪔', t:'마무리와 다음 강의', s:'남은 질문들과 예고', art:'lamp', wide:true,
  verse:'주의 말씀은 내 발에 등이요 내 길에 빛이니이다', ref:'시편 119:105',
  body:`
  <h3>목회자라면 누구나 익숙한 변증 질문들</h3>
  <div class="cards">
    <div class="card"><span class="k">❓</span><p>왜 고통이 존재하는가?</p></div>

  <p>다음 강연에서는 변증학의 주요 주제인 <strong>기독교적 관점에서 우리의 세상과 인간 상황을 어떻게 이해할 수 있는가</strong>를 다룹니다. 이번 강연에서 간략히 소개한 <strong>‘큰 그림으로서의 기독교’</strong>라는 아이디어를 발전시키고, 그것이 변증학적으로 얼마나 큰 도움이 되는지 보여 줄 것입니다.</p>
  <div class="key">“아주 곧 다시 뵙기를 기대합니다. 경청해 주셔서 정말 감사합니다.”<br>— 알리스터 맥그래스</div>`}
];

const menu = document.getElementById('menu');
SECTIONS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.style.setProperty('--c',s.c);
  if(s.wide) b.className='wide';
  b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span class="ico">${s.ico}</span><span class="t">${s.t}</span><span class="s">${s.s}</span>`;
  b.onclick=()=>openSec(i);
  menu.appendChild(b);
});

const ov=document.getElementById('overlay'), panel=document.getElementById('panel');
let cur=0;
function openSec(i){
  cur=i; const s=SECTIONS[i];
  panel.style.setProperty('--c',s.c);
  document.getElementById('pIco').textContent=s.ico;
  document.getElementById('pTitle').innerHTML=`<small>${String(i+1).padStart(2,'0')} · ${s.s}</small>${s.t}`;
  document.getElementById('pArt').innerHTML=ART[s.art];
  document.getElementById('pVerse').innerHTML=`${s.verse}<b>— ${s.ref}</b>`;
  document.getElementById('pBody').innerHTML=s.body;
  document.getElementById('prevBtn').disabled=i===0;
  document.getElementById('nextBtn').disabled=i===SECTIONS.length-1;
  ov.classList.add('open'); ov.scrollTop=0; document.body.style.overflow='hidden';
}
function closeSec(){ov.classList.remove('open');document.body.style.overflow='';}
document.getElementById('closeBtn').onclick=closeSec;
document.getElementById('homeBtn').onclick=closeSec;
document.getElementById('prevBtn').onclick=()=>cur>0&&openSec(cur-1);
document.getElementById('nextBtn').onclick=()=>cur<SECTIONS.length-1&&openSec(cur+1);
ov.addEventListener('click',e=>{if(e.target===ov)closeSec();});
document.addEventListener('keydown',e=>{
  if(!ov.classList.contains('open'))return;
  if(e.key==='Escape')closeSec();
  if(e.key==='ArrowRight'&&cur<SECTIONS.length-1)openSec(cur+1);
  if(e.key==='ArrowLeft'&&cur>0)openSec(cur-1);
});
</script>
</body>
