<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>궁수자리 A* — 우리 은하의 어두운 심장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0f2e; --night2:#1a1650; --violet:#6c5ce7; --gold:#ffcf6e; --amber:#ff9f43;
  --flame:#ff6b3d; --cream:#fff8ec; --paper:#fffdf7; --ink:#2b2340; --ink-soft:#4c4466;
  --sky:#8fd3ff; --rose:#ff8fab; --line:rgba(255,207,110,.35);
  --shadow:0 18px 50px rgba(10,6,40,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px}
body{
  font-family:'Noto Sans KR',sans-serif; font-size:20px; line-height:1.75; color:#f6f1ff;
  background:radial-gradient(ellipse at 50% 45%,#2a1f6b 0%,#141040 45%,#070920 100%) fixed;
  background-color:var(--night); min-height:100vh; overflow-x:hidden;
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===== HERO ===== */
.hero{
  position:relative; z-index:1; overflow:hidden; word-break:keep-all; min-height:100svh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:40px 16px; gap:28px; text-align:center;
}
.kicker{
  display:inline-block; font-size:20px; letter-spacing:.12em; color:var(--gold);
  border:1.5px solid var(--line); border-radius:999px; padding:6px 22px; background:rgba(255,207,110,.08);
}
.title{
  font-family:'Black Han Sans',sans-serif; font-weight:400; line-height:1.1;
  font-size:clamp(56px,11vw,120px);
  background:linear-gradient(180deg,#fff6d8 0%,#ffcf6e 45%,#ff8a3d 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 6px 30px rgba(255,150,60,.45));
}
.subtitle{font-family:'Gowun Batang',serif; font-weight:700; font-size:clamp(24px,3.6vw,34px); color:#fff3dc}
.en{font-size:20px; color:#c9c1f5; font-style:italic}

/* black hole stage, menu sits in its exact centre */
.stage{position:relative; width:100%; max-width:1080px; display:flex; align-items:center; justify-content:center; padding:20px 0}
.bh{
  position:absolute; left:50%; top:50%; width:min(118vw,820px); aspect-ratio:1; transform:translate(-50%,-50%);
  pointer-events:none; z-index:0;
}
.bh .disk{
  position:absolute; inset:14%; border-radius:50%;
  background:conic-gradient(from 0deg,#ffdf8a,#ff7a2f,#ffb347,#ff4d2e,#ffd36b,#ff7a2f,#ffdf8a);
  filter:blur(22px); opacity:.55; animation:spin 40s linear infinite;
  mask:radial-gradient(circle,transparent 38%,#000 42%,#000 58%,transparent 70%);
  -webkit-mask:radial-gradient(circle,transparent 38%,#000 42%,#000 58%,transparent 70%);
}
.bh .core{position:absolute; inset:33%; border-radius:50%; background:radial-gradient(circle,#000 62%,rgba(0,0,0,.6) 75%,transparent 80%);
  box-shadow:0 0 80px 18px rgba(255,140,60,.35), inset 0 0 40px rgba(255,190,90,.25); opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}

.menu{
  position:relative; z-index:1; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; width:100%; max-width:1040px;
}
.mbtn{
  position:relative; cursor:pointer; text-align:left; border:none; font:inherit; color:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1.5px solid rgba(255,214,140,.35); border-radius:22px; padding:20px 20px 22px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,.35); transition:transform .25s, box-shadow .25s, border-color .25s, background .25s;
  display:flex; flex-direction:column; gap:6px; min-height:170px;
}
.mbtn:hover,.mbtn:focus-visible{
  transform:translateY(-6px); border-color:var(--gold); outline:none;
  box-shadow:0 0 0 3px rgba(255,207,110,.25),0 18px 40px rgba(255,140,60,.35);
  background:linear-gradient(160deg,rgba(255,207,110,.25),rgba(255,140,60,.08));
}
.mbtn .no{font-family:'Black Han Sans',sans-serif; font-size:30px; color:var(--gold); line-height:1}
.mbtn .ic{position:absolute; right:16px; top:14px; width:46px; height:46px}
.mbtn .t{font-weight:900; font-size:22px; line-height:1.35; color:#fff}
.mbtn .s{font-size:20px; line-height:1.45; color:#d8d0ff}
.hint{font-size:20px; color:#ffe6b0}
.hint b{color:var(--gold)}
.heroverse{
  max-width:820px; font-family:'Gowun Batang',serif; font-size:21px; color:#fff1d6; line-height:1.7;
  background:rgba(255,207,110,.08); border:1px solid var(--line); border-radius:18px; padding:16px 24px;
}
.heroverse cite{display:block; font-style:normal; color:var(--gold); margin-top:4px; font-family:'Noto Sans KR',sans-serif; font-weight:700}

/* ===== MODAL ===== */
.overlay{
  position:fixed; inset:0; z-index:50; background:rgba(6,4,24,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:28px 16px 60px;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
.overlay.open{opacity:1; pointer-events:auto}
.panel{
  word-break:keep-all; width:100%; max-width:1000px; background:var(--paper); color:var(--ink); border-radius:28px; overflow:hidden;
  box-shadow:var(--shadow); transform:translateY(30px) scale(.98); transition:transform .35s;
}
.overlay.open .panel{transform:none}
.phead{
  position:relative; padding:28px 32px 24px; color:#fff;
  background:linear-gradient(120deg,#1d1860 0%,#3b2a8f 55%,#c2551f 130%);
}
.phead .pno{font-family:'Black Han Sans',sans-serif; font-size:24px; color:var(--gold); letter-spacing:.06em}
.phead h2{font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:clamp(32px,5vw,46px); line-height:1.2; margin:4px 0 6px}
.phead p{font-size:21px; color:#efe8ff}
.close{
  position:absolute; right:18px; top:18px; width:52px; height:52px; border-radius:50%; border:2px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.12); color:#fff; font-size:28px; cursor:pointer; line-height:1;
}
.close:hover{background:var(--gold); color:var(--ink)}
.pbody{padding:28px 32px 34px; display:flex; flex-direction:column; gap:26px}
.showcase{display:grid; grid-template-columns:1.25fr 1fr; gap:22px; align-items:stretch}
.illus{border-radius:22px; overflow:hidden; background:#16134a; box-shadow:0 10px 26px rgba(40,20,90,.25); border:4px solid #fff; outline:2px solid #f3d9a6}
.illus svg{display:block; width:100%; height:auto}
.illus figcaption{background:#fff4dc; color:#6b4a12; font-size:20px; padding:8px 16px; text-align:center; font-family:'Gowun Batang',serif; font-weight:700}
.verse{
  position:relative; border-radius:22px; padding:26px 24px 22px; display:flex; flex-direction:column; justify-content:center; gap:14px;
  background:linear-gradient(170deg,#fff6df,#ffe7c2); border:2px solid #f2c97a;
}
.verse::before{content:"“"; position:absolute; left:14px; top:-14px; font-family:'Gowun Batang',serif; font-size:90px; color:#f0a53c; line-height:1}
.verse blockquote{font-family:'Gowun Batang',serif; font-weight:700; font-size:22px; line-height:1.75; color:#4a2f06}
.verse cite{font-style:normal; font-weight:900; font-size:20px; color:#b0560f; text-align:right}
.verse .v2{border-top:1.5px dashed #e3b064; padding-top:12px}
.verse .v2 blockquote{font-size:20px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px}
.stat{background:#f3f0ff; border:1.5px solid #d8cffb; border-radius:18px; padding:14px 16px}
.stat b{display:block; font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:28px; line-height:1.25; color:#4b33c9}
.stat span{font-size:20px; color:var(--ink-soft); line-height:1.45; display:block}
.story h3{font-size:24px; font-weight:900; color:#3b2a8f; margin-bottom:10px; display:flex; align-items:center; gap:10px}
.story h3::before{content:""; width:10px; height:28px; border-radius:6px; background:linear-gradient(#ffcf6e,#ff7a2f)}
.story p{font-size:20px; line-height:1.9; color:#2f2a45; margin-bottom:14px; word-break:keep-all}
.story p.em{font-family:'Gowun Batang',serif; font-weight:700; font-size:22px; color:#7a3d06; background:#fff3dc; border-left:6px solid #f0a53c; padding:12px 18px; border-radius:0 14px 14px 0}
.medit{background:linear-gradient(120deg,#ecf7ff,#f3efff); border:2px solid #b9dcff; border-radius:20px; padding:18px 22px; font-size:20px; color:#23305a; line-height:1.8}
.medit strong{display:block; font-size:21px; color:#1d4f9a; margin-bottom:4px}
.pnav{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.pnav button{
  flex:1 1 220px; font:inherit; font-size:20px; font-weight:700; cursor:pointer; border-radius:16px; padding:14px 18px;
  border:2px solid #d8cffb; background:#fff; color:#3b2a8f; transition:.2s;
}
.pnav button:hover{background:#3b2a8f; color:#fff; border-color:#3b2a8f}
.pnav .home{background:linear-gradient(90deg,#ffcf6e,#ff9f43); border-color:#f0a53c; color:#3a2200}

/* compare bars */
.bars{display:flex; flex-direction:column; gap:12px}
.bar{display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:center; font-size:20px}
.bar .track{background:#ece7ff; border-radius:999px; height:34px; overflow:hidden; position:relative}
.bar .fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#6c5ce7,#ff7a2f); min-width:8px}
.bar .val{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:700; color:#2b2340; font-size:20px; white-space:nowrap}
.bar .fill.small + .val{left:20px}

footer{position:relative; z-index:1; text-align:center; font-size:20px; color:#bdb4ee; padding:0 16px 36px}

@media (max-width:900px){
  .menu{grid-template-columns:repeat(2,1fr)}
  .showcase{grid-template-columns:1fr}
}
@media (max-width:560px){
  .hero{gap:20px; padding:32px 14px}
  .menu{gap:12px}
  .mbtn{padding:16px 14px 18px; min-height:150px; border-radius:18px}
  .mbtn .ic{width:36px; height:36px; right:10px; top:10px}
  .mbtn .t{font-size:21px}
  .phead{padding:22px 20px 20px; padding-right:76px}
  .pbody{padding:22px 18px 28px}
  .bar{grid-template-columns:1fr}
  .heroverse{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){ .bh .disk{animation:none} }
</style>

<body>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="hero">
  <span class="kicker">우주 다큐멘터리 · 말씀과 함께 보는 은하의 중심</span>
  <div>
    <h1 class="title">궁수자리 A*</h1>
    <p class="subtitle">우리가 모두 돌고 있는 보이지 않는 거인</p>
    <p class="en">Sagittarius A*: The Invisible Giant We Are All Orbiting</p>
  </div>

  <div class="stage">
    <div class="bh" aria-hidden="true"><div class="disk"></div><div class="core"></div></div>
    <nav class="menu" id="menu" aria-label="상세 내용 메뉴"></nav>
  </div>

  <p class="hint">✦ 궁금한 <b>메뉴를 눌러</b> 이야기를 펼쳐 보세요 ✦</p>
  <div class="heroverse">하늘이 하나님의 영광을 선포하고 궁창이 그의 손으로 하신 일을 나타내는도다<cite>시편 19:1</cite></div>
</main>

<footer>우리 은하의 중심, 발견의 역사 · S2 별의 궤도 · EHT 촬영 · 압도적 질량 · 2만 6천 년의 시간 지연</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <article class="panel" id="panel"></article>
</div>

<script>
/* ---------- Starfield ---------- */
(function(){
  const c=document.getElementById('stars'), x=c.getContext('2d'); let W,H,S=[];
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;
    S=Array.from({length:Math.min(320,Math.floor(innerWidth*innerHeight/4500))},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.3)*devicePixelRatio,p:Math.random()*6.28,s:.01+Math.random()*.03,h:Math.random()<.15?'255,214,150':(Math.random()<.2?'170,200,255':'255,255,255')}));}
  function draw(){x.clearRect(0,0,W,H);for(const s of S){s.p+=s.s;const a=.35+.65*Math.abs(Math.sin(s.p));x.fillStyle=`rgba(${s.h},${a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}requestAnimationFrame(draw);}
  addEventListener('resize',size);size();draw();
})();

/* ---------- Storybook illustration helpers ---------- */
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function starDots(n,seed,w,h,yMax){const r=rnd(seed);let o='';for(let i=0;i<n;i++){const cx=r()*w,cy=r()*(yMax||h),rr=r()*1.8+.6;o+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="#fff" opacity="${(.5+r()*.5).toFixed(2)}"/>`;}return o;}
function twinkle(x,y,s,c){c=c||'#fff3c4';return `<path d="M${x} ${y-s} Q${x+s*.18} ${y-s*.18} ${x+s} ${y} Q${x+s*.18} ${y+s*.18} ${x} ${y+s} Q${x-s*.18} ${y+s*.18} ${x-s} ${y} Q${x-s*.18} ${y-s*.18} ${x} ${y-s}Z" fill="${c}"/>`;}
function sky(id,top,bot){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="600" height="420" fill="url(#${id})"/>`;}
function galaxy(cx,cy,r,id,rot){rot=rot||0;
  return `<defs><radialGradient id="${id}"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffb36b" stop-opacity=".55"/><stop offset=".7" stop-color="#9b7bff" stop-opacity=".25"/><stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/></radialGradient></defs>
  <g transform="translate(${cx},${cy}) rotate(${rot}) scale(1,.55)">
   <circle r="${r}" fill="url(#${id})"/>
   <g fill="none" stroke="#ffe4b8" stroke-linecap="round" opacity=".75">
    <path d="M0 0 C ${r*.3} ${-r*.5}, ${r*.9} ${-r*.3}, ${r*.95} ${r*.25}" stroke-width="${r*.09}"/>
    <path d="M0 0 C ${-r*.3} ${r*.5}, ${-r*.9} ${r*.3}, ${-r*.95} ${-r*.25}" stroke-width="${r*.09}"/>
    <path d="M0 0 C ${r*.5} ${r*.2}, ${r*.4} ${r*.85}, ${-r*.2} ${r*.9}" stroke-width="${r*.05}" opacity=".7"/>
    <path d="M0 0 C ${-r*.5} ${-r*.2}, ${-r*.4} ${-r*.85}, ${r*.2} ${-r*.9}" stroke-width="${r*.05}" opacity=".7"/>
   </g>
   <circle r="${r*.2}" fill="#ffb347" opacity=".9"/>
   <circle r="${r*.12}" fill="#120a24"/>
  </g>`;}
/* friendly round storybook figure, feet at (x,y) */
function person(o){const {x,y,s=1,robe='#5b8def',sash='#ffcf6e',head='#e9e2d0',band='#c0392b',beard=null,arm='up',flip=false}=o;
  const f=flip?-1:1;
  const armPath = arm==='up' ? `<path d="M10 -78 Q30 -110 46 -150" stroke="${robe}" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="46" cy="-152" r="9" fill="#f6cfa6"/>`
     : arm==='lamp' ? `<path d="M10 -74 Q34 -70 44 -54" stroke="${robe}" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="45" cy="-52" r="8" fill="#f6cfa6"/>`
     : arm==='scroll' ? `<path d="M-14 -70 Q4 -58 18 -66" stroke="${robe}" stroke-width="15" stroke-linecap="round" fill="none"/><rect x="10" y="-86" width="16" height="44" rx="6" fill="#f7e6c0" stroke="#b98a3e" stroke-width="3"/>`
     : `<path d="M-14 -70 Q0 -56 14 -70" stroke="${robe}" stroke-width="15" stroke-linecap="round" fill="none"/>`;
  return `<g transform="translate(${x},${y}) scale(${s*f},${s})">
   <ellipse cx="0" cy="2" rx="40" ry="8" fill="#000" opacity=".25"/>
   <path d="M-34 0 Q-40 -60 -22 -96 Q0 -106 22 -96 Q40 -60 34 0 Z" fill="${robe}"/>
   <path d="M-30 -48 Q0 -38 30 -48" stroke="${sash}" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path d="M-6 -96 L0 0" stroke="rgba(255,255,255,.18)" stroke-width="6"/>
   ${armPath}
   <circle cx="0" cy="-124" r="25" fill="#f6cfa6"/>
   ${beard?`<path d="M-20 -122 Q-22 -88 0 -84 Q22 -88 20 -122 Q10 -108 0 -110 Q-10 -108 -20 -122Z" fill="${beard}"/>`:''}
   <path d="M-29 -118 Q-32 -156 0 -158 Q32 -156 29 -118 Q30 -96 34 -80 L24 -82 Q22 -112 20 -128 Q0 -140 -20 -128 Q-22 -112 -24 -82 L-34 -80 Q-30 -96 -29 -118Z" fill="${head}"/>
   <path d="M-27 -136 Q0 -146 27 -136" stroke="${band}" stroke-width="5" fill="none"/>
   <path d="M-11 -128 q4 -5 8 0 M3 -128 q4 -5 8 0" stroke="#4a2f20" stroke-width="2.6" fill="none" stroke-linecap="round"/>
   <circle cx="-13" cy="-118" r="4.5" fill="#ff9aa8" opacity=".7"/><circle cx="13" cy="-118" r="4.5" fill="#ff9aa8" opacity=".7"/>
   ${beard?'':`<path d="M-5 -112 q5 5 10 0" stroke="#a2483a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`}
  </g>`;}
function sheep(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".2"/>
 <g fill="#fbf7ef"><circle cx="-14" cy="-22" r="14"/><circle cx="2" cy="-28" r="16"/><circle cx="16" cy="-20" r="13"/><circle cx="0" cy="-14" r="15"/><circle cx="-20" cy="-12" r="10"/></g>
 <rect x="-12" y="-6" width="5" height="10" rx="2" fill="#4a3b3b"/><rect x="8" y="-6" width="5" height="10" rx="2" fill="#4a3b3b"/>
 <ellipse cx="26" cy="-26" rx="10" ry="12" fill="#5a4646"/><circle cx="29" cy="-28" r="1.8" fill="#fff"/><ellipse cx="20" cy="-34" rx="6" ry="3" fill="#5a4646"/></g>`;}

/* ---------- Illustrations ---------- */
const ILL = {
 shepherd:()=>`<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="언덕 위 목동 소년이 은하를 바라보는 동화풍 그림">${sky('g1','#1b1659','#4a3a8f')}${starDots(90,3,600,420,300)}
  ${galaxy(390,130,150,'gx1',-18)}${twinkle(110,70,10)}${twinkle(530,260,8,'#cfe6ff')}
  <path d="M0 330 Q150 280 300 318 T600 300 V420 H0Z" fill="#2e6b5e"/><path d="M0 360 Q200 330 360 362 T600 352 V420 H0Z" fill="#3f8a6c"/>
  <g fill="#ffe08a" opacity=".85"><circle cx="70" cy="385" r="3"/><circle cx="520" cy="392" r="3"/><circle cx="430" cy="400" r="2.5"/></g>
  <path d="M120 372 L96 214 Q92 196 108 196" stroke="#8a5a2b" stroke-width="7" fill="none" stroke-linecap="round"/>
  ${person({x:160,y:372,s:.95,robe:'#4f7fd9',head:'#f2e6c8',band:'#e67e22'})}
  ${sheep(300,380,1)}${sheep(370,392,.8)}</svg>`,

  verse2:{t:'창세로부터 그의 보이지 아니하는 것들 곧 그의 영원하신 능력과 신성이 그가 만드신 만물에 분명히 보여 알게 되었나니',r:'로마서 1:20'},
  stats:[['초속 230km','지금 이 순간 우리가 움직이는 속도'],['2만 6천 광년','은하 중심까지의 거리'],['2,000억 개','함께 돌고 있는 우리 은하의 별들'],['태양 질량 400만 배','중심에 자리한 초대질량 블랙홀']],
  body:[
   ['너는 지금 이 순간에도 무엇인가를 중심에 두고 초당 230km의 속도로 움직이고 있다. 2만 6천 광년 떨어진 곳에 있는 어떤 것을 향해 말이다.'],
   ['너는 평생 동안 이렇게 움직여 왔고, 너의 부모님도 그랬으며, 네가 알고 있는 모든 조상들과 지구상에 살았던 모든 인류도 그러했다. 밤하늘에서 본 모든 별들, 2,000억 개의 별들과 가스 구름, 행성들 — 우리 은하의 모든 것들이 거대하고 참을성 있는 궤도를 그리며 동일한 보이지 않는 중심 주위를 돌고 있다.'],
   ['그 중심에는 태양 질량의 400만 배에 달하는 초대질량 블랙홀이 자리 잡고 있다. 그리고 인류 역사의 대부분 동안 우리는 그것이 거기에 있다는 사실조차 알지 못했다.'],
   ['오늘 밤 우리는 우리가 아는 모든 것의 보이지 않는 중심, 우리 은하의 어두운 심장인 궁수자리 A*의 이야기를 추적해 본다. 시작하자.','em']],
  medit:'은하 전체가 보이지 않는 한 중심을 돌듯, 우리의 삶도 보이지 않으나 실재하시는 분을 중심으로 붙들려 있습니다.'},

{ no:'02', icon:'veil', menu:'은하 중심을 가로막던 암흑의 장막', sub:'먼지 구름 너머의 전파원',
  title:'은하 중심을 가로막던 암흑의 장막', lead:'블랙홀은 볼 수 없다. 블랙홀이 하는 행동을 통해서만 볼 수 있을 뿐이다.',

  verse:{t:'주에게서는 흑암이 숨기지 못하며 밤이 낮과 같이 비추이나니 주에게는 흑암과 빛이 같음이니이다',r:'시편 139:12'},

  body:[
   ['수천 년 동안 사람들은 밤하늘을 올려다보며 우리 은하를 하늘에 길게 뻗은 한 줄기의 빛으로 보았다. 희미하고 흐릿하며 아름답지만, 그것은 단지 빛일 뿐이었다.'],
   ['1900년대 초반에 이르러서야 우리는 그것이 무엇인지 이해하게 되었다. 그것은 거대한 나선 은하였고, 우리는 중심에서 바깥쪽으로 약 3분의 2쯤 떨어진 가장자리에 위치해 있었다. 우리는 그 중심에 별빛이 모여 있는 조밀한 밀집 지역이 있을 것이라고 가정했지만, 그것은 단지 더 가까이 모여 있고 더 밝은 별들일 뿐 별다른 특별한 것은 없을 것이라고 생각했다.'],
   ['문제는 가시성이었다. 우리와 은하 중심 사이에는 엄청난 양의 가스와 먼지 구름이 가로막고 있어 가시광선을 완전히 차단하고 있었다. 일반 망원경으로 궁수자리 쪽을 바라보면 어둠 외에는 아무것도 보이지 않는다. 수세기 동안 우리 은하의 중심은 숨겨져 있었다.'],
   ['그러다 1970년대에 이르러 전파 망원경들이 은하 중심을 스캔하기 시작했다. 전파는 먼지를 통과할 수 있었고, 과학자들은 거기서 이상한 것을 발견했다. 강력하고 컴팩트한 전파원이었다. 밝고, 집중되어 있으며, 움직이지 않았다. 별빛이라고 하기에는 너무 밝았고, 성단이라고 하기에는 너무 작았으며, 가스라고 하기에는 너무 밀집되어 있었다.'],
   ['과학자들은 하늘에서 그것이 나타난 별자리의 이름을 따서 그것을 궁수자리 A*(Sagittarius A*)라고 이름 붙였다. 그곳에는 모든 것을 자신 쪽으로 끌어당기는 어마어마한, 보이지 않는 무언가가 존재하고 있었다.'],
   ['하지만 블랙홀은 볼 수 없다. 블랙홀이 하는 행동을 통해서만 그것을 볼 수 있을 뿐이다.','em']],

  stats:[['16년','S2의 공전 주기 (태양은 은하 한 바퀴에 2억 3천만 년)'],['17광시간','블랙홀에 가장 가까이 다가가는 거리 (해왕성–태양 약 4광시간)'],['초속 7,000~8,000km','근점 속도, 빛의 약 2~3%'],['2002 · 2018','S2의 근점 통과 — 완벽한 한 주기']],
  body:[
   ['1990년대에 두 팀의 천문학자들은 과학 역사상 가장 끈질긴 실험 중 하나를 시작했다. 하와이의 케크(Keck) 관측소와 칠레의 초거대망원경(VLT)이었다. 두 팀 모두 하늘의 동일한 지점, 즉 은하 중심을 겨누었다.'],
   ['우리 눈으로는 볼 수 없는 파장인 적외선 카메라를 사용하여, 그들은 궁수자리 A* 근처의 개별 별들을 추적했다. 수백 개가 아니라 수십 개의 별을 해마다, 이미지마다 관찰하며 그 움직임을 지켜보았다. 그리고 별들은 빠르게 움직였다. 먼 거리의 물체에서 기대할 수 있는 느린 표류가 아니었다. 이 별들은 태양 주위를 도는 행성들처럼 보이지 않는 무언가 주위를 엄청난 속도로 휘돌고 있었다. 타원형의, 격렬하고 팽팽한 궤도였다.'],
   ['그중 하나의 별이 핵심 열쇠가 되었다. 푸르고 하얀 별로, 그 위치와 움직이는 방식을 제외하고는 평범한 별이었다. 연구팀은 그 별을 S2라고 불렀다. S2는 16년마다 궁수자리 A* 주위를 공전한다. 은하 중심을 공전하는 물체로서는 엄청나게 빠른 속도다. 우리의 태양이 은하를 한 바퀴 도는 데는 2억 3천만 년이 걸리지만, S2는 단 16년 만에 이를 해낸다.'],
   ['근점(periapsis), 즉 S2가 블랙홀에 가장 가까이 다가가는 지점에서 S2는 궁수자리 A*로부터 단 17광시간 거리 이내로 접근한다. 해왕성이 태양으로부터 약 4광시간 떨어져 있으니, S2는 그만큼 블랙홀에 바짝 다가가는 것이다. 그 거리에서 S2는 빛의 속도의 약 2~3퍼센트, 즉 초속 7,000~8,000km로 가속한다. 지구에서 달까지의 거리를 1분도 안 되어 주파할 수 있는 속도다.'],
   ['과학자들은 수십 년 동안 S2를 추적하며 해마다 그 움직임을 기록했다. 2002년과 2018년에 S2가 블랙홀을 스치듯 지나가는 모습을 지켜보았다. 근점에서 근점까지 완벽한 16년의 공전 주기가 완성된 것이다. 다음 공전 주기도 이미 프레임별로, 연도별로 진행 중이었다. S2는 근점에 접근하며 가속했고, 멀어지면서 감속했다. 그 궤도는 거대한 점광원 주위를 도는 물체에서 기대할 수 있는 정확히 그 모습, 완벽한 케플러 궤도였다.'],
   ['그들은 계산을 수행했다. 그렇게 빠른 속도로 그렇게 팽팽한 궤도를 그리며 별을 움직이게 하려면, 태양계의 수성 궤도보다 더 작은 공간에 집중된 엄청나게 무거운 무언가가 중심에 존재해야만 했다. 대략 태양 질량의 400만 배였다. 어떤 성단도 붕괴하지 않고는 그렇게 조밀할 수 없고, 어떤 가스 구름도 그런 중력 아래에서 함께 유지될 수 없다. 어떤 일반적인 물체도 그토록 작은 공간에 그토록 많은 질량을 숨길 수 없다.'],
   ['오직 단 하나의 대상만이 그 증거에 부합했다. 바로 초대질량 블랙홀이다. 2002년이 되자 결론이 내려졌다. 궁수자리 A*는 단순한 전파원이 아니었다. 그것은 블랙홀이었다. 우리의 블랙홀 말이다.','em']],
  medit:'별 하나하나의 길을 정하시고 이름을 부르시는 분 앞에서, 인간의 관측은 이미 놓인 질서를 뒤늦게 발견하는 일입니다.'},

{ no:'04', icon:'ring', menu:'EHT가 포착한 최초의 이미지', sub:'2022년 5월, 처음 본 얼굴',
  title:'사건의 지평선 너머: EHT가 포착한 최초의 이미지', lead:'생애 통째로 주위를 돌던 그 존재의 얼굴을 처음으로 마주하다.',
  ill:'eht', cap:'온 땅의 망원경이 하나 되어 하늘의 고리를 바라보다',
  verse:{t:'하늘이 하나님의 영광을 선포하고 궁창이 그의 손으로 하신 일을 나타내는도다',r:'시편 19:1'},
  stats:[['2019년','M87* 최초 이미지 공개 (5,500만 광년)'],['2022년 5월','궁수자리 A* 이미지 공개'],['52 마이크로아크세컨드','그림자 고리의 지름'],['6개 지역','칠레·하와이·애리조나·멕시코·스페인·남극']],
  body:[
   ['수십 년 동안 우리는 그것이 거기에 있다는 것을 알았다. 질량을 측정할 수 있었고, 그것을 공전하는 별들을 추적할 수 있었으며, 그 중력을 매핑할 수 있었다. 하지만 우리는 그것을 본 적이 없었다.'],
   ['2019년, 전 세계 크기의 전파 망원경 네트워크인 사건의 지평선 망원경(Event Horizon Telescope, EHT)은 5,500만 광년 떨어진 은하 중심의 블랙홀 M87*의 최초 이미지를 공개했다. 빛나는 고리, 그리고 그림자라는 증거였다.'],
   ['그리고 2022년 5월, EHT는 두 번째 이미지를 공개했다. 이번에는 더 가까운 곳, 바로 집 앞마당인 궁수자리 A*였다. 궁수자리 A*는 촬영하기가 더 까다로웠기 때문에 M87*보다 시간이 더 오래 걸렸다. M87*은 거대하고 안정적이어서 며칠 또는 몇 주에 걸쳐 서서히 변한다. 반면 궁수자리 A*는 더 작고 깜빡거린다. 가스가 몇 분에서 몇 시간 간격으로 그 주위를 소용돌이치며 회전하고, 밝기는 끊임없이 변한다. 마치 가만히 앉아 있기를 거부하는 아이를 촬영하려 애쓰는 것과 같다. 게다가 그 아이는 2만 6천 광년 떨어져 있다.'],
   ['연구팀은 칠레, 하와이, 애리조나, 멕시코, 스페인, 남극에 있는 망원경들의 데이터를 동기화했다. 여러 관측소가 하나의 망원경처럼 작동했다. 신호를 결합하고, 지구의 자전을 보정하며, 대기 왜곡을 조정하고, 픽셀 단위로 이미지를 구축했다.'],
   ['그리고 마침내 그것을 얻어냈다. 뜨거운 가스의 밝은 고리, 중력에 의해 원형으로 꺾인 빛이 사건의 지평선을 선회하고 있었다. 그 중심에는 그림자, 즉 빛이 포착되어 만들어진 어두운 실루엣이 있었다. 지름 52마이크로아크세컨드 — 지구에서 달 표면의 도넛을 보거나, 로스앤젤레스에서 뉴욕에 있는 신문을 읽는 것과 같은 크기다.'],
   ['생애 통째로 주위를 돌고 있던 그 존재의 얼굴을 우리는 처음으로 마주 보게 된 것이다.','em'],
   ['그런데 이상한 점이 있다. 궁수자리 A*는 퀘이사(quasar)가 아니다. 타오르지 않는다. 매일 밤 별들을 집어삼키지도 않는다. 대부분의 경우 그것은 조용하고 굶주려 있으며 입을 다물고 있는 거인이다. 우리는 괴물보다 훨씬 더 기이한 무언가, 곧 휴식 상태에 있는 초대질량 블랙홀을 보고 있는 것이다. 그리고 그것을 보게 되면서 우리는 묻게 되었다. 우리가 실제로 보고 있는 것은 무엇인가, 400만 배의 태양 질량은 진정 무엇을 의미하는가.']],
  medit:'온 세계의 망원경이 한마음으로 하늘을 볼 때 비로소 보였습니다. 창조의 영광은 함께 바라볼 때 더 선명해집니다.'},

{ no:'05', icon:'mass', menu:'400만 태양 질량의 압도적 규모', sub:'1조 3천억 개의 지구',
  title:'400만 태양 질량의 압도적 규모', lead:'상상할 수 없는 질량이 무한한 밀도로 짓눌려 있다.',
  ill:'abraham', cap:'아브라함이 장막 밖에서 하늘의 뭇별을 세다',
  verse:{t:'그를 이끌고 밖으로 나가 이르시되 하늘을 우러러 뭇별을 셀 수 있나 보라 또 그에게 이르시되 네 자손이 이와 같으리라',r:'창세기 15:5'},
  verse2:{t:'그가 별들의 수효를 세시고 그것들을 다 이름대로 부르시는도다',r:'시편 147:4'},
  stats:[['약 2,400만 km','사건의 지평선 지름 = 태양 17개'],['80초','빛이 지평선 지름을 가로지르는 시간'],['1조 3천억 개','궁수자리 A*와 같은 질량의 지구 수'],['약 4시간','태양 자리에 둔다면 지구의 1년 길이']],
  bars:true,
  body:[
   ['태양 질량의 400만 배. 지구에 생명을 주는 140만 km 너비의 핵융합 덩어리, 태양 같은 별 400만 개가 특이점으로 압축되어 있다는 뜻이다. 만약 우리의 태양을 블랙홀로 압축할 수 있다면 사건의 지평선은 직경 약 6km 크기가 될 것이다. 이제 그것을 400만 번 반복하여 모든 것을 단 하나의 점으로 짓밟는다고 상상해 보라. 그것이 바로 궁수자리 A*이다.'],
   ['궁수자리 A*의 사건의 지평선은 직경이 약 2,400만 km로, 태양 17개를 나란히 놓은 정도의 크기다. 초속 30만 km로 움직이는 빛도 그 지름을 가로지르는 데 약 80초, 즉 1분 20초가 걸린다. 그것이 바로 경계이자, 돌아올 수 없는 지점이다.'],
   ['명확히 해 두자. 사건의 지평선은 표면이 아니다. 껍질도 아니다. 그것은 탈출이 방향이기를 멈추는 공간의 선이다. 그 안쪽에서는 우리의 일상적인 개념들이 깨진다. 블랙홀이 어둠으로 만들어져서가 아니라, 중력이 너무나 극단적이어서 빛조차 빠져나올 수 없기 때문이다. 더 깊이 들어가면 우리의 방정식은 특이점을 예측한다. 수학이 의미를 잃고 물리학이 언어를 잃어버리는 장소 말이다.','em'],
   ['만약 궁수자리 A*를 태양의 자리에 갖다 놓는다면, 지평선은 여전히 수성의 궤도 안에 들어오겠지만 그 질량은 태양의 400만 배가 될 것이다. 지구는 지금의 거리에서 지금과 같은 방식으로 공전할 수 없다. 1 AU(천문단위) 거리에서 안정적인 궤도를 유지하려면 빛의 속도의 약 5분의 1로 이동해야 하며, 1년은 불과 4시간 조금 넘게 지속될 것이다. 지평선은 태양계에 비해 작지만, 중력은 그렇지 않다.'],
   ['질량 자체를 생각해 보자. 태양은 지구의 약 33만 3,000배 무게다. 너무나 막대해서 수십억 킬로미터에 걸쳐 8개의 행성을 궤도에 붙잡아 둔다. 궁수자리 A*는 그보다 400만 배나 더 무겁다. 1조 3,000억 개의 지구에 해당한다. 지구만 한 물체들을 끝과 끝을 맞대어 일렬로 세운다면, 그 사슬은 가장 가까운 별까지 갔다가 되돌아오기를 약 200번 반복할 수 있는 길이가 된다.'],
   ['다른 블랙홀들과 비교해 보자. 궁수자리 A*는 태양 질량의 400만 배다. 2019년에 촬영된 M87*은 65억 배, 지금까지 발견된 가장 큰 블랙홀 중 하나인 톤 618(TON 618)은 660억 배로, 궁수자리 A*보다 16,000배 더 무겁다. 이에 비하면 궁수자리 A*는 아주 작다. 하지만 ‘작다’는 것은 상대적인 말일 뿐이다. 400만 개의 태양, 1조 3,000억 개의 지구, 상상할 수 없는 질량이 무한한 밀도로 짓눌려 있는 것이다.']],
  medit:'인간은 별을 다 셀 수 없으나, 하나님은 별의 수효를 세시고 이름을 부르십니다. 우리가 느끼는 압도감은 창조주의 크심을 가리키는 표지판입니다.'},

{ no:'06', icon:'time', menu:'2만 6천 년의 시간의 벽', sub:'우리가 보는 것은 언제나 과거',
  title:'2만 6천 년의 시간의 벽: 우리가 보는 것은 과거다', lead:'우리는 언제나 과거를 보고 있으며 결코 현재를 볼 수 없다.',
  ill:'hourglass', cap:'별가루가 흐르는 모래시계 곁의 노인',
  verse:{t:'주의 목전에는 천 년이 지나간 어제 같으며 밤의 한 순간 같을 뿐임이니이다',r:'시편 90:4'},
  stats:[['2만 6천 년 전','우리가 지금 보는 궁수자리 A*의 모습'],['46억 년 전','태양계 형성 — 그때 이미 고대의 존재'],['30만 년','현대 인류의 역사 (2만 6천 년 ≈ 약 1/10)'],['2만 6천 년 후','2026년의 궁수자리 A* 빛이 도착하는 때']],
  body:[
   ['궁수자리 A*는 2만 6천 광년 떨어져 있다. 지구에서 가장 가까운 초대질량 블랙홀이다. 우리가 궁수자리 A*를 바라볼 때, 우리는 그것을 지금 현재의 모습으로 보는 것이 아니다. 2만 6천 년 전에 존재했던 모습 그대로를 보고 있다.'],
   ['당시 인류는 마지막 빙하기를 통과하며 살고 있었다. 작은 무리, 모닥불, 석기 도구들. 최초의 도시는 아직 1만 년이나 미래의 일이었고, 문자는 존재하지 않았으며, 농업도 시작되지 않았다. 그 광자들은 먼지를 뚫고, 나선팔을 뚫고, 별들 사이의 조용한 길을 지나 마침내 우리의 망원경에 도달한 것이다.'],
   ['궁수자리 A*는 고대부터 존재했다. 은하들이 아직 젊고 서로 충돌하며 합병하던 시기, 최초의 별들이 우주를 비추기 시작하던 수십억 년 전 우주 초기에 형성되었을 가능성이 높다. 46억 년 전 우리 태양계가 형성되었을 때 그것은 이미 그곳에 있었다. 이미 거대하고 이미 고대였다. 지구에 생명체가 처음 나타났을 때도, 공룡들이 지배하다가 멸종했을 때도, 최초의 인간들이 밤하늘을 올려다보았을 때도 그것은 거기에 있었다.'],
   ['태양이 죽은 후에도, 지구가 사라진 후에도, 우리가 볼 수 있는 모든 별들이 타버리거나 팽창하는 공허 속으로 흩어져 버린 지 오랜 후에도 그것은 여전히 그곳에 남아 있을 것이다. 그리고 그동안 내내 똑같은 일을 해 왔다. 끌어당기고, 붙잡고, 닻을 내리는 일 말이다.'],
   ['지금 이 순간에도 궁수자리 A*는 무언가를 하고 있다. 가스를 안쪽으로 끌어당기거나, 구름이 너무 가까이 표류할 때 불꽃을 뿜어내거나, 혹은 조용히 있을 수도 있다. 별들은 그 주위를 공전하고 있다. S2는 16년짜리 궤도의 어딘가에 있고, 다른 별들은 근점을 향해 가속하거나 멀어지고 있다. 사건의 지평선은 그 자리에 있고, 빛의 고리는 빛나고 있다. 무언가 일어나고 있지만 우리는 그것을 볼 수 없다. 지금 이 순간의 모습을 보여 줄 빛은 2만 6천 년이 지나야 비로소 지구에 도달할 것이다.'],
   ['지금부터 2만 6천 년 후의 미래를 깊이 생각해 보라. 현대 인류는 대략 30만 년 전에 출현했다. 2만 6천 년은 인류 존재 기간 전체의 거의 10분의 1에 달한다. 그때 인간 문명은 알아볼 수 없을 정도로 변해 있을지도 모른다. 은하 전역으로 퍼져 나갔을 수도, 스스로를 파괴했을 수도, 우리가 인식하지 못할 무언가로 진화했을 수도 있다. 기후는 변하고, 대륙은 표류하고, 종들은 멸종하고 새로운 종들이 나타났을 것이다. 밤하늘의 별들도 다른 위치로 옮겨 가 있을 것이다.'],
   ['오직 그때가 되어서야, 오늘날의 궁수자리 A*에서 나온 빛이 마침내 도착할 것이다. 그제야 관측자들이 존재한다면 2026년의 궁수자리 A*가 어떤 모습이었는지 보게 될 것이다.'],
   ['우리는 언제나 과거를 보고 있으며 결코 현재를 볼 수 없다.','em'],
   ['2022년에 우리가 촬영한 블랙홀은 2만 6천 년 전의 궁수자리 A*였다. 1990년대부터 추적해 온 S2의 궤도 역시 우리가 보기 2만 6천 년 전에 일어난 사건들이다. 궁수자리 A*에 대해 우리가 아는 모든 것, 모든 측정과 관측과 이미지는 고대 역사일 뿐이다.'],
   ['그것을 우회할 방법은 없다. 빛에는 속도 제한이 있고, 정보에도 속도 제한이 있다. 우리는 거리뿐 아니라 시간 그 자체에 의해 궁수자리 A*와 격리되어 있다. 결코 건널 수 없는 2만 6천 년의 간극이다. 지금 당장의 궁수자리 A*는 어떤 모습일까? 우리는 알 수 없다. 향후 2만 6천 년 동안은 불가능하다. 우리에게 있는 것은 오직 과거뿐이며, 언제나 과거뿐이다.']],
  medit:'인간은 2만 6천 년 늦게 보지만, 하나님께는 천 년이 어제 같습니다. 과거·현재·미래를 한눈에 보시는 분이 시간의 주인이십니다.'},

{ no:'07', icon:'anchor', menu:'우리 은하를 지탱하는 보이지 않는 닻', sub:'집의 중심, 어두운 랜드마크',
  title:'우리 은하의 심장을 지탱하는 보이지 않는 닻', lead:'모든 것의 중심에 있는 보이지 않는 존재.',
  ill:'anchor', cap:'은하 아래 빛나는 닻과 작은 배',
  verse:{t:'우리가 이 소망을 가지고 있는 것은 영혼의 닻 같아서 튼튼하고 견고하여 휘장 안에 들어가나니',r:'히브리서 6:19'},
  verse2:{t:'그의 능력의 말씀으로 만물을 붙드시며',r:'히브리서 1:3'},
  stats:[['초속 230km','태양계의 공전 속도 — 약 3분에 지구 한 바퀴'],['2억 3천만 년','은하 중심을 한 바퀴 도는 시간'],['9.9년','S62의 공전 주기 — 근점에서 빛의 거의 10%'],['7~8만 광년','은하 가장자리, 수억 년에 걸친 궤도']],
  body:[
   ['과거는 궁수자리 A*가 무엇을 하는지 우리에게 말해 주기에 충분하다. 궁수자리 A*가 우리 은하 전체를 혼자서 붙잡고 있는 것은 아니다. 은하는 별, 가스, 암흑물질 등 그 모든 질량이 합쳐져 결합되어 있다. 하지만 궁수자리 A*는 은하의 내면 심장을 지배한다.'],
   ['코어 근처에서는 그 중력이 압도적이다. 가장 가까운 별들의 리듬을 정하고, 우리가 모든 것을 측정하는 기준이 되는 바로 그 중심에 닻을 내린다. 그런 의미에서, 조용하고 가차 없이, 그것은 집의 중심에 있는 어두운 랜드마크다.'],
   ['우리는 초속 230km, 약 3분 만에 지구 한 바퀴를 돌 수 있는 속도로 공전하고 있다. 하지만 은하 중심은 너무나 멀어서 한 바퀴를 온전히 도는 데 약 2억 3천만 년이 걸린다. 우리 태양계가 이 궤도상의 위치에 마지막으로 있었을 때는 공룡조차 나타나기 전이었다. 지금부터 2억 3천만 년 후 우리가 다시 이 자리로 돌아왔을 때 지구는 알아볼 수 없게 변해 있거나 사라져 있을지도 모른다.'],
   ['궁수자리 A*에 더 가까운 별들은 더 빨리 공전한다. S2는 16년 만에 한 바퀴를 돌고, 또 다른 별 S62는 알려진 가장 짧은 공전 주기 중 하나인 불과 9.9년 만에, 근점에서 빛의 속도의 거의 10퍼센트에 달하는 속도로 블랙홀 주변을 비행하듯 돈다고 보고되었다. 더 멀리 있는 별들은 한 바퀴를 도는 데 수천 년이 걸리고, 중심에서 7만~8만 광년 떨어진 은하 가장자리에서는 별들이 수억 년에 걸쳐 궤도를 기어가듯 돈다.'],
   ['어떤 별들은 수십억 년 동안 궁수자리 A* 주위를 돌아 왔고, 앞으로도 수십억 년 동안 계속 돌 것이다. 태어났다가 죽어 가는 모든 세대의 별들이 동일한 보이지 않는 닻에 의해 궤도에 붙잡혀 있다.'],
   ['궁수자리 A*는 신경 쓰지 않는다. 서두르지도 쉬지도 않는다. 인내심 있고, 보이지 않으며, 조용하지만 절대적이다. 코어 근처의 모든 별은 그것에게 굴복한다. 모든 궤도, 모든 탄도, 모든 움직임이 그 중력에 의해 형성된다. 그것과는 협상할 수 없고, 달아날 수도 없다. 우리는 그것에 묶여 있다. 모든 것의 중심에 있는 조용한 폭군에게 말이다.'],
   ['지금 이 순간에도 궁수자리 방향 저 깊은 곳에 블랙홀이 존재한다. 눈으로는 볼 수 없고 하늘을 가리키며 “저기 있다”고 말할 수도 없지만, 그것은 거기에 있다. 그리고 당신은 평생 동안 그 주위를 돌고 있었다. 당신의 부모님도, 당신 이전의 모든 세대도, 당신이 본 모든 별도 그러했다. 2022년이 되어서야 비로소 사진을 찍을 수 있었던 무언가에 붙잡혀 있는 것이다.'],
   ['우리가 여전히 있는 그대로 볼 수 없고, 오직 2만 6천 년 전의 모습으로만 볼 수 있는 그것. 우리 은하의 어두운 심장. 우주에서 가장 거대한 블랙홀도, 가장 멀리 있는 것도, 가장 밝은 것도 아니지만 바로 우리의 것이다. 집의 중심, 인내심 있고, 조용하며, 피할 수 없는 존재.'],
   ['당신은 지금 이 순간에도 그것의 주위를 돌고 있다. 당신이 태어났을 때도 그랬고, 당신이 사라질 때도 그럴 것이다. 언제나 회전하나 결코 도착하지 않으며, 언제나 늦게 보나 결코 지금을 보지 못한다. 모든 것의 중심에 있는 보이지 않는 존재, 결코 달아날 수 없는 존재, 영원히 묶여 있던 존재. 궁수자리 A*. 우리 은하의 어두운 심장.','em']],
  medit:'블랙홀은 별들을 조용한 폭군처럼 붙잡지만, 그리스도는 만물을 능력의 말씀으로 붙드시며 우리 영혼에 사랑의 닻을 내리십니다. 우리는 두려움이 아니라 소망에 묶여 있습니다.'},

  body:[
   ['은하의 모든 별이 보이지 않는 중심에 붙들려 있다는 사실은, 보이는 것 너머의 실재를 생각하게 합니다. 우리는 블랙홀을 직접 보지 못하고 그것이 별들에게 미치는 영향으로 그 존재를 압니다. 성경은 창조된 만물을 통해 하나님의 보이지 않는 능력과 신성이 분명히 드러난다고 말합니다(롬 1:20).'],
   ['2만 6천 년 늦게 도착하는 빛 앞에서 우리는 피조물의 한계를 배웁니다. 그러나 하나님께는 천 년이 하루 같고(시 90:4), 흑암도 그분 앞에서 숨지 못합니다(시 139:12). 우주의 중심보다 크신 분이 우리를 기억하시고 돌보신다는 것 — 이것이 시편 기자의 놀라움이었습니다(시 8:3-4).','em'],
   ['궁수자리 A*는 “조용한 폭군”처럼 별들을 붙잡지만, 그리스도는 만물보다 먼저 계시고 만물이 그 안에 함께 서 있습니다(골 1:17). 그분은 능력의 말씀으로 만물을 붙드시며(히 1:3), 우리의 소망은 영혼의 닻처럼 튼튼하고 견고합니다(히 6:19).']],
  medit:'오늘 밤 하늘을 올려다볼 때, 보이지 않는 은하의 중심보다 더 확실한 우리 삶의 중심을 기억합시다. “하늘이 하나님의 영광을 선포하고” (시 19:1).'}

/* ---------- Mass comparison bars (log scale) ---------- */
function bars(){
  const d=[['궁수자리 A*',4e6,'400만 태양질량'],['M87*',6.5e9,'65억 태양질량'],['TON 618',6.6e10,'660억 태양질량']];
  const lo=Math.log10(1e6), hi=Math.log10(6.6e10);
  return `<div class="story"><h3>블랙홀 질량 비교 (로그 척도)</h3><div class="bars">${d.map(x=>{
    const w=10+90*(Math.log10(x[1])-lo)/(hi-lo);
    return `<div class="bar"><b>${x[0]}</b><div class="track"><div class="fill" style="width:${w.toFixed(1)}%"></div><span class="val">${x[2]}</span></div></div>`;}).join('')}</div>
    <p style="margin-top:12px">TON 618은 궁수자리 A*보다 <b>16,000배</b> 더 무겁습니다. 그래도 400만 개의 태양은 상상을 넘어서는 질량입니다.</p></div>`;
}

/* ---------- Panel ---------- */
const overlay=document.getElementById('overlay'), panel=document.getElementById('panel'); let cur=0, lastFocus=null;
function openPanel(i){
  cur=i; const s=SECTIONS[i]; lastFocus=document.activeElement;
  const prev=SECTIONS[(i+SECTIONS.length-1)%SECTIONS.length], next=SECTIONS[(i+1)%SECTIONS.length];
  panel.innerHTML=`
  <header class="phead"><div class="pno">CHAPTER ${s.no}</div><h2 id="ptitle">${s.title}</h2><p>${s.lead}</p>
    <button class="close" type="button" aria-label="닫기" onclick="closePanel()">✕</button></header>
  <div class="pbody">
    <div class="showcase">
      <figure class="illus">${ILL[s.ill]()}<figcaption>${s.cap}</figcaption></figure>
      <aside class="verse"><blockquote>${s.verse.t}</blockquote><cite>— ${s.verse.r}</cite>
        ${s.verse2?`<div class="v2"><blockquote>${s.verse2.t}</blockquote><cite>— ${s.verse2.r}</cite></div>`:''}</aside>
    </div>
    <div class="stats">${s.stats.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
    ${s.bars?bars():''}
    <section class="story"><h3>${s.no==='08'?'말씀으로 바라보는 은하의 중심':'이야기'}</h3>${s.body.map(p=>`<p${p[1]?' class="em"':''}>${p[0]}</p>`).join('')}</section>
    <div class="medit"><strong>✦ 말씀 묵상</strong>${s.medit}</div>
    <nav class="pnav"><button type="button" onclick="openPanel(${(i+SECTIONS.length-1)%SECTIONS.length})">◀ ${prev.menu}</button>
      <button type="button" class="home" onclick="closePanel()">처음 메뉴로</button>
      <button type="button" onclick="openPanel(${(i+1)%SECTIONS.length})">${next.menu} ▶</button></nav>
  </div>`;
  overlay.classList.add('open'); overlay.scrollTop=0; document.body.style.overflow='hidden';
  panel.querySelector('.close').focus();
}
function closePanel(){overlay.classList.remove('open'); document.body.style.overflow=''; if(lastFocus) lastFocus.focus();}
overlay.addEventListener('click',e=>{if(e.target===overlay) closePanel();});
document.addEventListener('keydown',e=>{
  if(!overlay.classList.contains('open')) return;
  if(e.key==='Escape') closePanel();
  if(e.key==='ArrowRight') openPanel((cur+1)%SECTIONS.length);
  if(e.key==='ArrowLeft') openPanel((cur+SECTIONS.length-1)%SECTIONS.length);
});
</script>
</body>
